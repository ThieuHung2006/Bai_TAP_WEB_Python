{% extends "base.html" %}

{% block content %}
    <h1 class="page-title">Thêm lời nhắn mới</h1>

    <div class="card">
        {% if error %}
            <div class="alert-error">
                {{ error }}
            </div>
        {% endif %}

        <form action="{{ url_for('add') }}" method="POST" class="guestbook-form">
            <div class="form-group">
                <label for="name">Tên của bạn:</label>
                <input type="text" id="name" name="name" value="{{ name or '' }}" placeholder="Nhập tên của bạn...">
            </div>

            <div class="form-group">
                <label for="message">Lời nhắn:</label>
                <textarea id="message" name="message" rows="5" placeholder="Viết lời nhắn tại đây...">{{ message or '' }}</textarea>
            </div>

            <button type="submit" class="btn-submit">Gửi lời nhắn</button>
        </form>
    </div>
{% endblock %}
