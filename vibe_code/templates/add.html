{% extends "base.html" %}

{% block title %}Viết Lời Nhắn Mới - Sổ Lưu Bút (Vibe Code){% endblock %}

{% block content %}
    <div class="form-card glass">
        <header class="form-header">
            <h1>✍️ Để Lại Lời Nhắn</h1>
            <p>Chia sẻ cảm nghĩ, kỷ niệm hoặc gửi lời chúc đến mọi người nhé!</p>
        </header>

        {% if error %}
            <div class="alert-box" id="error-alert">
                <span style="font-size: 1.2rem;">⚠️</span>
                <span>{{ error }}</span>
            </div>
        {% endif %}

        <form action="{{ url_for('add') }}" method="POST" id="guestbook-add-form" novalidate>
            <div class="form-group">
                <label for="name" class="form-label">Tên của bạn <span style="color: var(--danger);">*</span></label>
                <input type="text" 
                       id="name" 
                       name="name" 
                       class="form-input" 
                       placeholder="Ví dụ: Nguyễn Văn A, Tech Enthusiast..." 
                       value="{{ name or '' }}"
                       required
                       autofocus>
            </div>

            <div class="form-group">
                <label for="message" class="form-label">Nội dung lời nhắn <span style="color: var(--danger);">*</span></label>
                <textarea id="message" 
                          name="message" 
                          class="form-textarea" 
                          placeholder="Nhập nội dung lời nhắn bạn muốn gửi gắm tại đây..." 
                          required>{{ message or '' }}</textarea>
                <div class="textarea-footer">
                    <span class="char-counter"><span id="char-count">0</span> ký tự</span>
                </div>
            </div>

            <div style="display: flex; gap: 14px; margin-top: 10px;">
                <a href="{{ url_for('index') }}" class="btn-outline" style="flex: 1;">
                    ← Quay lại
                </a>
                <button type="submit" class="btn-primary" style="flex: 2;" id="btn-submit-message">
                    ✨ Gửi lời nhắn ngay
                </button>
            </div>
        </form>
    </div>
{% endblock %}
